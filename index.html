<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hitster Spotify Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(90%, 500px);
            padding: 30px;

            background: white;
            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            line-height: 1.7;
        }

        #status {
            margin: 25px 0;
            padding: 15px;

            border-radius: 10px;
            background: #f0f0f0;

            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 18px;

            border: none;
            border-radius: 12px;

            background: #1DB954;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .info {
            margin-top: 25px;
            padding: 15px;

            background: #fafafa;
            border-radius: 10px;

            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        .step {
            margin: 8px 0;
        }
    </style>
</head>

<body>


    <h1>🎵 Hitster Test</h1>

   

</body>
</html>
