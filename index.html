<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hitster Spotify URI Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(90%, 500px);
            padding: 30px;

            background: white;
            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            line-height: 1.7;
        }

        #status {
            margin: 25px 0;
            padding: 15px;

            border-radius: 10px;

            background: #f0f0f0;

            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 18px;

            border: none;
            border-radius: 12px;

            background: #1DB954;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .info {
            margin-top: 25px;
            padding: 15px;

            background: #fafafa;
            border-radius: 10px;

            font-size: 13px;
            color: #666;

            line-height: 1.7;

            word-break: break-all;
        }

        .success {
            background: #e8f5e9 !important;
            color: #1b5e20;
        }

        .error {
            background: #ffebee !important;
            color: #b71c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎵 Hitster Test</h1>

    <p class="description">
        Spotify URIを使った<br>
        自動2段階起動テスト
    </p>

    <div id="status">
        準備完了
    </div>

    <button id="playButton">
        Spotifyを再生
    </button>

    <div class="info">

        <strong>Spotify URI</strong>

        <br>

        <span>
            spotify:track:6JpqwdFajjlWIWJ4QD6zBd
        </span>

    </div>

</div>


<script>

    /*
     * ==========================================
     * Spotify URI
     * ==========================================
     */

    const spotifyUri =
        "spotify:track:6JpqwdFajjlWIWJ4QD6zBd";


    /*
     * ==========================================
     * HTML要素
     * ==========================================
     */

    const status =
        document.getElementById("status");

    const playButton =
        document.getElementById("playButton");


    /*
     * ==========================================
     * ボタン
     * ==========================================
     */

    playButton.addEventListener(
        "click",
        startSpotify
    );


    /*
     * ==========================================
     * Spotify開始
     * ==========================================
     */

    function startSpotify() {

        playButton.disabled = true;

        /*
         * ① 1回目
         */

        status.textContent =
            "① Spotifyアプリを起動しています...";

        openSpotify();


        /*
         * ② 1.5秒後
         */

        setTimeout(() => {

            status.textContent =
                "② Spotifyをもう一度起動しています...";

            openSpotify();

        }, 1500);


        /*
         * ③ 3秒後
         */

        setTimeout(() => {

            status.textContent =
                "🎵 2段階処理を終了しました";

            status.classList.add("success");

            playButton.disabled = false;

        }, 3000);

    }


    /*
     * ==========================================
     * Spotify URIを開く
     * ==========================================
     */

    function openSpotify() {

        console.log(
            "Spotify URI:",
            spotifyUri
        );

        window.location.href =
            spotifyUri;

    }

</script>

</body>
</html>
