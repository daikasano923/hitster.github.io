<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hitster</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;

            color: #222;
        }

        .container {
            width: min(90%, 500px);

            padding: 30px;

            background: white;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        #status {
            margin: 25px 0;

            padding: 15px;

            border-radius: 10px;

            background: #f0f0f0;

            font-weight: bold;
        }

        .error {
            background: #ffebee !important;
            color: #b71c1c;
        }

        .info {
            margin-top: 20px;

            padding: 15px;

            background: #fafafa;

            border-radius: 10px;

            font-size: 14px;

            color: #666;

            word-break: break-all;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>🎵 Hitster</h1>

    <div id="status">
        曲情報を読み込んでいます...
    </div>

    <div
        id="info"
        class="info"
    >
        カード情報を取得中...
    </div>

</div>


<script>


/*
 * ==========================================
 * 要素
 * ==========================================
 */

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");



/*
 * ==========================================
 * URLからカードIDを取得
 *
 * 例：
 * ?id=001
 *
 * ==========================================
 */

const params =
    new URLSearchParams(
        window.location.search
    );

const cardId =
    params.get("id");



/*
 * ==========================================
 * 起動
 * ==========================================
 */

start();



/*
 * ==========================================
 * メイン処理
 * ==========================================
 */

async function start() {

    /*
     * カードIDがない
     */

    if (!cardId) {

        showError(
            "カードIDがありません"
        );

        return;
    }


    /*
     * JSONを取得
     */

    try {

        const response =
            await fetch(
                "./songs.json"
            );


        /*
         * JSON取得失敗
         */

        if (!response.ok) {

            throw new Error(
                "songs.jsonを読み込めませんでした"
            );

        }


        /*
         * JSONを解析
         */

        const songs =
            await response.json();


        /*
         * カードを取得
         */

        const song =
            songs[cardId];


        /*
         * カードが存在しない
         */

        if (!song) {

            showError(
                "カードID「"
                + cardId
                + "」の曲が見つかりません"
            );

            return;
        }


        /*
         * 情報表示
         */

        info.innerHTML = `
            カードID：${cardId}<br>
            再生準備中...
        `;


        /*
         * Spotify再生
         */

        playSpotify(
            song.spotify
        );

    }

    catch (error) {

        console.error(error);

        showError(
            "曲情報の読み込みに失敗しました"
        );

    }

}



/*
 * ==========================================
 * Spotify再生
 * ==========================================
 */

function playSpotify(
    spotifyUri
) {

    /*
     * ① 1回目
     */

    status.textContent =
        "Spotifyを起動しています...";


    window.location.href =
        spotifyUri;



    /*
     * ② 1.5秒後
     */

    setTimeout(() => {

        status.textContent =
            "Spotifyを再生しています...";


        window.location.href =
            spotifyUri;

    }, 1500);



    /*
     * 完了表示
     */

    setTimeout(() => {

        status.textContent =
            "🎵 再生処理を実行しました";

    }, 3000);

}



/*
 * ==========================================
 * エラー表示
 * ==========================================
 */

function showError(
    message
) {

    status.textContent =
        "エラー";

    status.classList.add(
        "error"
    );

    info.textContent =
        message;

}

</script>


</body>

</html>
